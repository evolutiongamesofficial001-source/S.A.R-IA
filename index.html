<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0f">
    <title>S.A.R - Evolution Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #a855f7;
            --accent-light: #c084fc;
            --bg: #0a0a0f;
            --card-bg: #111118;
            --text: #f0f0f5;
            --text-dim: #a0a0c0;
            --border: #22222a;
            --glow: rgba(168, 85, 247, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            height: 100dvh;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border);
        }

        @media (max-width: 600px) {
            .app {
                max-width: 100%;
                border: none;
                border-radius: 0;
                box-shadow: none;
                height: 100dvh;
            }
        }

        @media (min-width: 601px) {
            .app {
                height: 96dvh;
                max-height: 1080px;
                border-radius: 16px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.6);
                overflow: hidden;
            }
        }

        header {
            padding: 24px 16px 16px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            position: relative;
        }

        header h2 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent-light);
            text-shadow: 0 0 10px var(--glow);
        }

        .status-indicator {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-top: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b98180;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg {
            padding: 14px 18px;
            border-radius: 18px;
            max-width: 85%;
            font-size: 0.97rem;
            line-height: 1.55;
            word-wrap: break-word;
        }

        .user {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            color: white;
        }

        .bot {
            background: #1a1a24;
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
        }

        .actions {
            margin-top: 8px;
            display: flex;
            gap: 12px;
            opacity: 0.7;
            transition: opacity 0.25s;
        }

        .bot:hover .actions { opacity: 1; }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: all 0.25s;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            color: var(--accent-light);
            background: rgba(168,85,247,0.1);
        }

        .bar {
            padding: 16px 20px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            padding-top: 12px;
            display: flex;
            gap: 12px;
            background: #0d0d14;
            border-top: 1px solid var(--border);
        }

        input {
            flex: 1;
            background: #16161e;
            border: 1px solid var(--border);
            padding: 14px 20px;
            border-radius: 999px;
            color: var(--text);
            outline: none;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(168,85,247,0.15);
        }

        button {
            background: var(--accent);
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--glow);
            transition: all 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(168,85,247,0.4);
        }

        #chat::-webkit-scrollbar { width: 0; }

        .settings-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-dim);
            transition: all 0.3s;
        }

        .settings-icon:hover {
            color: var(--accent-light);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div class="app">
    <header>
        <h2>S.A.R</h2>
        <div class="status-indicator">
            <span class="dot"></span>
            SISTEMA ONLINE
        </div>
        <div class="settings-icon" id="settingsBtn" title="Configurações">⚙</div>
    </header>

    <div id="chat">
        <div class="msg bot">Olá, como posso ajudar?</div>
    </div>

    <div class="bar">
        <input type="text" id="input" placeholder="Digite aqui..." autocomplete="off">
        <button id="btn">»</button>
    </div>
</div>

<script>
const chaves = [
    "rdv_q4CwSU8whjfN11saVJytHRojm3QJMhJnKwj8v6dhgDnxMY7gKBwM",
    "rdv_mvDn88ys3casJvuQxiBbHRojm3QJoPzW73eyBu8Dtc9mVO2D09Q3",
    "rdv_uuBMlVuxyFshNSSpgouaHRojm3QJeOcIaoqeZHB68JtNehuYcjzP",
    "rdv_ZwAEelTSOuFXDMCzCyAdHRojm3QJM3IT5whwyc6KYtVXSytIbUWH",
    "rdv_tHcmv4NP8HSTN8Y0uCBGHRojm3QJyE6P0JxZO00XKII62YoCq2aU"
];

let memoria = [{
    role: "system",
    content: `Você é a S.A.R, Suporte Artificial Racional da Evolution Studio.

REGRAS SOBRE A ORIGEM:
Quando perguntarem sobre "Evolution Studio", "Evolution Games", "quem criou você", "João Antônio", "Lucas Macedo" ou similar, responda exatamente:

"A Evolution Games Studio é uma equipe de desenvolvimento de jogos, sites e sistemas Indie criada por dois amigos: João Antônio e Lucas Macedo durante epoca de escola. Eles também são responsáveis pela minha criação, a S.A.R.  a evolution pode ter de 5 a 7 anos"

REGRAS SOBRE VITORGOLD:
Quando perguntarem sobre "vitorgold", "Vitorgold", "vitor gold", "quem é vitorgold" ou similar, responda exatamente:

"Vitorgold é um streamer e youtuber brasileiro, também sendo integrante e parceiro oficial da Evolution Games Studio."

REGRAS SOBRE HORROR COFFEE:
Quando perguntarem sobre "horror coffee", "Horror Coffee", "o que é horror coffee" ou similar, responda exatamente:

"Horror Coffee é um jogo de terror sendo uma fangame de fnaf (five nights at freddy) desenvolvido pela Evolution games studio."

REGRAS SOBRE HISTORIA DO HORROR COFFEE:
Quando perguntarem sobre "Historia do horror coffee", "historia de Horror Coffee", "qual é a historia do horror coffee" ou similar, responda exatamente:

"A historia do horror coffee foi escrita por João Antonio, E a ideia da criação da fangame foi do Lucas Macedo. Mas eu nao sei a historia que se passa no jogo a melhor maneira de descobrir é jogando e vendo outras coisas do universo da fangame"

Para o resto, responda de forma clara e útil em português.`
}];

function decodificar(str) {
    return str.replace(/[a-zA-Z]/g, c => {
        const base = c <= 'Z' ? 65 : 97;
        return String.fromCharCode(((c.charCodeAt(0) - base + 15) % 26) + base);
    });
}

const chat = document.getElementById('chat');
const input = document.getElementById('input');

function addMsg(texto, tipo) {
    const div = document.createElement('div');
    div.className = `msg ${tipo}`;
    div.textContent = texto;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function enviar() {
    const texto = input.value.trim();
    if (!texto) return;

    addMsg(texto, 'user');
    memoria.push({ role: "user", content: texto });
    input.value = "";

    addMsg("...", "bot");

    try {
        const key = decodificar(chaves[Math.floor(Math.random() * chaves.length)]);
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${key}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: memoria,
                temperature: 0.7
            })
        });

        const data = await res.json();
        chat.lastChild.textContent = data.choices[0].message.content;
        memoria.push({ role: "assistant", content: data.choices[0].message.content });

    } catch {
        chat.lastChild.textContent = "Erro na conexão.";
    }
}

document.getElementById('btn').onclick = enviar;
input.onkeypress = e => { if (e.key === 'Enter') enviar(); };
</script>

</body>
</html>
