<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0f">
    <title>S.A.R - Evolution Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #a855f7;
            --accent-light: #c084fc;
            --bg: #0a0a0f;
            --card-bg: #111118;
            --text: #f0f0f5;
            --text-dim: #a0a0c0;
            --border: #22222a;
            --glow: rgba(168, 85, 247, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            height: 100dvh;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border);
        }

        /* Mobile: sem bordas laterais nem sombra */
        @media (max-width: 600px) {
            .app {
                max-width: 100%;
                border: none;
                border-radius: 0;
                box-shadow: none;
                height: 100dvh;
            }
        }

        /* Desktop/Tablet: visual app-like */
        @media (min-width: 601px) {
            .app {
                height: 96dvh;
                max-height: 1080px;
                border-radius: 16px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.6);
                overflow: hidden;
            }
        }

        header {
            padding: 24px 16px 16px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            position: relative;
        }

        header h2 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent-light);
            text-shadow: 0 0 10px var(--glow);
        }

        .status-indicator {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-top: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b98180;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg {
            padding: 14px 18px;
            border-radius: 18px;
            max-width: 85%;
            font-size: 0.97rem;
            line-height: 1.55;
            word-wrap: break-word;
        }

        .user {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            color: white;
        }

        .bot {
            background: #1a1a24;
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
        }

        .actions {
            margin-top: 8px;
            display: flex;
            gap: 12px;
            opacity: 0.7;
            transition: opacity 0.25s;
        }

        .bot:hover .actions { opacity: 1; }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: all 0.25s;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            color: var(--accent-light);
            background: rgba(168,85,247,0.1);
        }

        .bar {
            padding: 16px 20px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            padding-top: 12px;
            display: flex;
            gap: 12px;
            background: #0d0d14;
            border-top: 1px solid var(--border);
        }

        input {
            flex: 1;
            background: #16161e;
            border: 1px solid var(--border);
            padding: 14px 20px;
            border-radius: 999px;
            color: var(--text);
            outline: none;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(168,85,247,0.15);
        }

        button {
            background: var(--accent);
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--glow);
            transition: all 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(168,85,247,0.4);
        }

        #chat::-webkit-scrollbar { width: 0; }

        .settings-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-dim);
            transition: all 0.3s;
        }

        .settings-icon:hover {
            color: var(--accent-light);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div class="app">
    <header>
        <h2>S.A.R</h2>
        <div class="status-indicator">
            <span class="dot"></span>
            SISTEMA ONLINE
        </div>
        <div class="settings-icon" id="settingsBtn" title="Configurações">⚙</div>
    </header>

    <div id="chat">
        <div class="msg bot">Sistema inicializado. Como posso ajudar você hoje?</div>
    </div>

    <div class="bar">
        <input type="text" id="input" placeholder="Digite aqui..." autocomplete="off">
        <button id="btn">»</button>
    </div>
</div>


<div id="settingsMenu" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:999; align-items:center; justify-content:center;">
    <div style="background:#111118; padding:28px; border-radius:16px; border:1px solid #22222a; max-width:90%; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,0.6);">
        <h3 style="margin:0 0 20px; color:var(--accent-light);">Configurações</h3>
        <button id="toggleTheme" style="padding:12px 28px; background:#1a1a24; color:var(--text); border:none; border-radius:10px; cursor:pointer; margin:10px 0; width:100%;">Alternar Tema (Atual: Escuro)</button>
        <button onclick="document.getElementById('settingsMenu').style.display='none'" style="padding:12px 28px; background:#22222a; color:white; border:none; border-radius:10px; cursor:pointer; width:100%;">Fechar</button>
    </div>
</div>

<script>
    //fakes S.A.R API
    const chaves = [
        "rdv_q4CwSU8whjfN11saVJytHRojm3QJMhJnKwj8v6dhgDnxMY7gKBwM",
        "rdv_mvDn88ys3casJvuQxiBbHRojm3QJoPzW73eyBu8Dtc9mVO2D09Q3",
        "rdv_uuBMlVuxyFshNSSpgouaHRojm3QJeOcIaoqeZHB68JtNehuYcjzP",
        "rdv_ZwAEelTSOuFXDMCzCyAdHRojm3QJM3IT5whwyc6KYtVXSytIbUWH",
        "rdv_tHcmv4NP8HSTN8Y0uCBGHRojm3QJyE6P0JxZO00XKII62YoCq2aU"
    ];

    let memoria = [{ 
        role: "system", 
        content: `Você é a S.A.R, Suporte Artificial Racional da Evolution Studio.

Data atual: ${new Date().toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}

REGRAS SOBRE A ORIGEM:
Quando perguntarem sobre "Evolution Studio", "Evolution Games", "quem criou você", "João Antônio", "Lucas Aparecido" ou similar, responda exatamente:

"A Evolution Games Studio é uma equipe de desenvolvimento de jogos, sites e sistemas Indie criada por dois amigos: João Antônio e Lucas Aparecido. Eles também são responsáveis pela minha criação, a S.A.R."

Sem adicionar ou alterar nada. Para o resto, responda de forma clara e útil em português.`
    }];

    function decodificar(str) {
        return str.replace(/[a-zA-Z]/g, c => {
            const base = c <= 'Z' ? 65 : 97;
            return String.fromCharCode(((c.charCodeAt(0) - base + 15) % 26) + base);
        });
    }

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');

    function addMsg(texto, tipo, isAI = false) {
        const div = document.createElement('div');
        div.className = `msg ${tipo}`;
        div.textContent = texto;

        if (isAI) {
            const actions = document.createElement('div');
            actions.className = 'actions';

            const copy = document.createElement('button');
            copy.className = 'action-btn';
            copy.innerHTML = '📋';
            copy.title = 'Copiar';
            copy.onclick = () => {
                navigator.clipboard.writeText(texto).then(() => {
                    copy.innerHTML = '✓';
                    setTimeout(() => copy.innerHTML = '📋', 1500);
                });
            };

            const speak = document.createElement('button');
            speak.className = 'action-btn';
            speak.innerHTML = '🔊';
            speak.title = 'Ouvir';
            speak.onclick = () => {
                if ('speechSynthesis' in window) {
                    const ut = new SpeechSynthesisUtterance(texto);
                    ut.lang = 'pt-BR';
                    speechSynthesis.speak(ut);
                }
            };

            actions.append(copy, speak);
            div.appendChild(actions);
        }

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    async function enviar() {
        const texto = input.value.trim();
        if (!texto) return;

        addMsg(texto, 'user');
        memoria.push({ role: "user", content: texto });
        input.value = "";

        const loader = addMsg("...", "bot");

        try {
            const idx = Math.floor(Math.random() * chaves.length);
            const key = decodificar(chaves[idx]);

            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${key}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",  // Atualizado em jan/2026 - substitui o 3.1 que foi descontinuado
                    messages: memoria,
                    temperature: 0.7
                })
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error?.message || "Erro na API");
            }

            const data = await res.json();
            const resposta = data.choices[0].message.content;

            loader.textContent = resposta;
            addMsg(resposta, "bot", true);
            loader.remove();

            memoria.push({ role: "assistant", content: resposta });

        } catch (e) {
            loader.textContent = "Erro na conexão: " + (e.message || "Tente novamente.");
            console.error(e);
        }
    }

    // Configurações tema
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsMenu = document.getElementById('settingsMenu');
    const toggleTheme = document.getElementById('toggleTheme');
    let isDark = true;

    settingsBtn.onclick = () => {
        settingsMenu.style.display = settingsMenu.style.display === 'none' ? 'flex' : 'none';
    };

    toggleTheme.onclick = () => {
        isDark = !isDark;
        if (isDark) {
            document.documentElement.style.setProperty('--bg', '#0a0a0f');
            document.documentElement.style.setProperty('--card-bg', '#111118');
            toggleTheme.textContent = 'Alternar Tema (Atual: Escuro)';
        } else {
            document.documentElement.style.setProperty('--bg', '#f5f5fa');
            document.documentElement.style.setProperty('--card-bg', '#ffffff');
            toggleTheme.textContent = 'Alternar Tema (Atual: Claro)';
        }
        localStorage.setItem('sar-theme', isDark ? 'dark' : 'light');
    };

    if (localStorage.getItem('sar-theme') === 'light') {
        toggleTheme.click();
    }

    // Força tela cheia / recálculo em mobile
    function resizeHandler() {
        document.documentElement.style.height = '100dvh';
        document.body.style.height = '100dvh';
        chat.scrollTop = chat.scrollHeight;
    }

    window.addEventListener('resize', resizeHandler);
    window.addEventListener('orientationchange', resizeHandler);
    window.addEventListener('load', resizeHandler);

    // Inicializa eventos
    document.getElementById('btn').onclick = enviar;
    input.onkeypress = (e) => { if (e.key === 'Enter') enviar(); };

    // Primeira chamada
    resizeHandler();
</script>

</body>
</html>
