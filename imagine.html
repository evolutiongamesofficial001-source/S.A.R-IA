<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080810">
  <title>S.A.R Imagine — Evolution Games Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ===== DESIGN SYSTEM (espelho do app) ===== */
    :root {
      --bg:        #080810;
      --surface:   #0e0e1a;
      --surface-2: #131320;
      --surface-3: #1a1a2e;
      --border:    rgba(255,255,255,.07);
      --border-2:  rgba(255,255,255,.12);
      --accent:    #7c6aff;
      --accent-2:  #a78bfa;
      --accent-glow: rgba(124,106,255,.25);
      --text:      #f0f0ff;
      --text-2:    #9090b8;
      --text-3:    #50506a;
      --red:       #f87171;
      --radius:    14px;
      --radius-sm: 8px;
      --font:      'Space Grotesk', sans-serif;
      --header-h:  56px;
      --bar-h:     78px;
    }
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== SHELL ===== */
    .app {
      width: 100%; height: 100dvh;
      max-width: 520px; margin: auto;
      display: flex; flex-direction: column;
      background: var(--surface);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      position: relative; overflow: hidden;
    }

    /* ===== HEADER ===== */
    header {
      height: var(--header-h);
      display: flex; align-items: center;
      padding: 0 16px; gap: 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(14,14,26,.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      flex-shrink: 0; z-index: 10;
    }
    .back-btn {
      display: flex; align-items: center; gap: 7px;
      background: none; border: 1px solid var(--border);
      color: var(--text-2); font-family: var(--font);
      font-size: .78rem; font-weight: 500;
      padding: 7px 12px; border-radius: var(--radius-sm);
      cursor: pointer; transition: all .2s; text-decoration: none;
      flex-shrink: 0;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent-2); background: rgba(124,106,255,.07); }
    .header-center {
      flex: 1;
      display: flex; flex-direction: column; align-items: center;
    }
    .header-title {
      font-size: .95rem; font-weight: 700;
      letter-spacing: .08em;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-sub {
      font-size: .6rem; color: var(--text-3); letter-spacing: .06em;
    }
    .quota-pill {
      font-size: .65rem; color: var(--text-3);
      background: var(--surface-3); border: 1px solid var(--border);
      padding: 5px 10px; border-radius: 20px;
      flex-shrink: 0; white-space: nowrap;
      transition: color .3s, border-color .3s;
    }
    .quota-pill.low { color: var(--red); border-color: rgba(248,113,113,.3); }

    /* ===== GALERIA (área principal) ===== */
    .gallery {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 16px 14px 12px;
      display: flex; flex-direction: column; gap: 16px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .gallery::-webkit-scrollbar { width: 3px; }
    .gallery::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

    /* Empty state */
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 32px 20px;
      text-align: center; pointer-events: none;
      animation: fadeIn .4s ease;
    }
    .empty-icon {
      width: 64px; height: 64px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .empty-icon svg { opacity: .35; }
    .empty-title { font-size: .95rem; font-weight: 600; color: var(--text-2); }
    .empty-desc { font-size: .76rem; color: var(--text-3); line-height: 1.5; max-width: 260px; }

    /* Card de imagem gerada */
    .img-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      animation: cardIn .35s cubic-bezier(.22,1,.36,1) forwards;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(14px) scale(.97); }
      to   { opacity:1; transform: none; }
    }
    .img-card img {
      width: 100%; display: block;
      object-fit: cover; aspect-ratio: 1;
    }
    .img-card-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .img-card-prompt {
      font-size: .73rem; color: var(--text-3);
      line-height: 1.45; font-style: italic;
    }
    .img-card-meta {
      display: flex; align-items: center; justify-content: space-between;
    }
    .img-card-style {
      font-size: .65rem; font-weight: 600;
      padding: 3px 9px; border-radius: 20px;
      letter-spacing: .05em;
    }
    .img-card-actions { display: flex; gap: 8px; }
    .dl-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 10px;
      font-size: .73rem; font-weight: 600;
      font-family: var(--font); cursor: pointer;
      background: var(--accent); border: none; color: #fff;
      box-shadow: 0 3px 12px var(--accent-glow);
      transition: all .18s; flex: 1; justify-content: center;
    }
    .dl-btn:hover { background: #9370ff; transform: translateY(-1px); }
    .dl-btn:active { transform: scale(.94); }
    .del-btn {
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid var(--border); background: none;
      color: var(--text-3); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .18s;
    }
    .del-btn:hover { border-color: var(--red); color: var(--red); background: rgba(248,113,113,.06); }

    /* Skeleton loading */
    .skeleton-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 18px; overflow: hidden;
      animation: cardIn .2s ease;
    }
    .skeleton-img {
      width: 100%; aspect-ratio: 1;
      background: var(--surface-3);
      position: relative; overflow: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
    }
    .skeleton-shimmer {
      position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(124,106,255,.1) 50%, transparent 70%);
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .skeleton-orbs { display: flex; gap: 10px; position: relative; z-index: 1; }
    .skeleton-orbs span {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent); opacity: .4;
      animation: orbPulse 1.4s ease-in-out infinite;
    }
    .skeleton-orbs span:nth-child(2) { animation-delay: .2s; background: var(--accent-2); }
    .skeleton-orbs span:nth-child(3) { animation-delay: .4s; }
    @keyframes orbPulse { 0%,100%{opacity:.2;transform:scale(.75)} 50%{opacity:1;transform:scale(1.2)} }
    .skeleton-label {
      font-size: .75rem; color: var(--text-3);
      position: relative; z-index: 1; letter-spacing: .06em;
    }
    .skeleton-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .skeleton-line {
      height: 10px; border-radius: 6px;
      background: var(--surface-3);
      animation: shimmer 1.6s ease-in-out infinite;
    }

    /* ===== PROMPTS PRONTOS ===== */
    .prompts-label {
      font-size: .6rem; font-weight: 600;
      color: var(--text-3); letter-spacing: .1em;
      text-transform: uppercase; padding: 0 2px 2px;
    }
    .prompt-chip {
      flex-shrink: 0; display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 20px;
      border: 1px solid var(--border);
      background: none; color: var(--text-2);
      font-family: var(--font); font-size: .71rem; font-weight: 500;
      cursor: pointer; transition: all .18s; white-space: nowrap;
    }
    .prompt-chip:hover {
      border-color: var(--border-2); color: var(--text);
      background: var(--surface-3);
    }
    .prompt-chip.selected {
      background: rgba(124,106,255,.13);
      border-color: rgba(124,106,255,.4);
      color: var(--accent-2);
    }
    .prompt-chip-emoji { font-size: .9rem; }

    /* ===== SELEÇÃO DE ESTILO ===== */
    .style-row {
      display: flex; gap: 6px;
      overflow-x: auto; padding-bottom: 2px;
      scrollbar-width: none;
    }
    .style-row::-webkit-scrollbar { display: none; }
    .style-chip {
      flex-shrink: 0; padding: 7px 14px;
      border-radius: 20px; border: 1px solid var(--border);
      background: none; color: var(--text-2);
      font-family: var(--font); font-size: .73rem; font-weight: 500;
      cursor: pointer; transition: all .18s; white-space: nowrap;
    }
    .style-chip:hover { border-color: var(--border-2); color: var(--text); }
    .style-chip.active {
      background: rgba(124,106,255,.14);
      border-color: rgba(124,106,255,.45);
      color: var(--accent-2);
    }

    /* ===== INPUT BAR ===== */
    .input-bar {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: rgba(14,14,26,.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px 14px 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .input-wrap {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      border-radius: var(--radius);
      padding: 6px 6px 6px 12px;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    #prompt {
      flex: 1; background: none; border: none;
      color: var(--text); font-size: .875rem;
      font-family: var(--font); outline: none;
      padding: 8px 0; min-height: 36px;
    }
    #prompt::placeholder { color: var(--text-3); }
    .gen-btn {
      width: 38px; height: 38px; border-radius: 10px;
      border: none; background: var(--accent);
      color: #fff; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s, box-shadow .2s, background .2s;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .gen-btn:hover { background: #9370ff; box-shadow: 0 6px 20px rgba(124,106,255,.5); transform: scale(1.04); }
    .gen-btn:active { transform: scale(.92); }
    .gen-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    /* ===== TOAST ===== */
    .toast {
      position: absolute; bottom: calc(var(--bar-h) + 14px);
      left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--surface-3); border: 1px solid var(--border-2);
      border-radius: 10px; padding: 10px 16px;
      font-size: .77rem; color: var(--text-2);
      white-space: nowrap; z-index: 50;
      opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
      box-shadow: 0 6px 24px rgba(0,0,0,.5);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { color: var(--red); border-color: rgba(248,113,113,.3); }

    /* ===== UTILS ===== */
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .icon-btn {
      width: 34px; height: 34px; border-radius: var(--radius-sm);
      background: none; border: none; color: var(--text-2);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .2s, color .2s;
    }
    .icon-btn:hover { background: var(--surface-3); color: var(--text); }
  </style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header>
    <a href="index.html" class="back-btn" aria-label="Voltar ao chat">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M8 2L3 6.5 8 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Voltar
    </a>
    <div class="header-center">
      <div class="header-title">S.A.R Imagine</div>
      <div class="header-sub">Gerador de imagens</div>
    </div>
    <div class="quota-pill" id="quotaPill">— / 4</div>
  </header>

  <!-- GALERIA -->
  <div class="gallery" id="gallery">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none"><rect x="2" y="2" width="26" height="26" rx="5" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="2.5" fill="currentColor"/><path d="M2 20l7-7 5.5 5.5L21 11.5l7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="empty-title">Nenhuma imagem ainda</div>
      <div class="empty-desc">Escolha um estilo, descreva de forma bem detalhada o que quer ver e toque em gerar.(quanto maior o pronpt melhor)</div>
    </div>
  </div>

  <!-- INPUT BAR -->
  <div class="input-bar">
    <!-- Prompts prontos -->
    <div class="prompts-label">Inspirações</div>
    <div class="style-row" id="promptsRow"></div>

    <!-- Seleção de estilo -->
    <div class="style-row" id="styleRow"></div>

    <!-- Prompt -->
    <div class="input-wrap">
      <input id="prompt" placeholder="Descreva a imagem que deseja gerar…" autocomplete="off" spellcheck="false" aria-label="Prompt de imagem">
      <button class="gen-btn" id="genBtn" aria-label="Gerar imagem">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1v10M5 8l3 3 3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 13h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ====================================================
   S.A.R Imagine — gerador de imagens
   Evolution Games Studio
   ==================================================== */

/* ---------- ESTILOS ---------- */
const ESTILOS = [
  { id: "nenhum",      label: "✦ Livre",      cor: "#a78bfa", corBg: "rgba(167,139,250,.12)", sufixo: "" },
  { id: "realista",    label: "📷 Realista",   cor: "#60a5fa", corBg: "rgba(96,165,250,.12)",  sufixo: ", photorealistic, 8K, sharp details, professional photography, DSLR, natural lighting" },
  { id: "anime",       label: "🎌 Anime",      cor: "#f472b6", corBg: "rgba(244,114,182,.12)", sufixo: ", anime style, cel shading, vibrant colors, Studio Ghibli inspired, detailed illustration" },
  { id: "cyberpunk",   label: "⚡ Cyberpunk",  cor: "#34d399", corBg: "rgba(52,211,153,.12)",  sufixo: ", cyberpunk aesthetic, neon lights, rain-soaked streets, dark atmosphere, futuristic, cinematic" },
  { id: "oleo",        label: "🎨 Óleo",       cor: "#fb923c", corBg: "rgba(251,146,60,.12)",  sufixo: ", oil painting style, brushstrokes, classical art, rich textures, Renaissance inspired, museum quality" },
  { id: "fantasia",    label: "🧙 Fantasia",   cor: "#a78bfa", corBg: "rgba(167,139,250,.12)", sufixo: ", epic fantasy art, magical atmosphere, dramatic lighting, detailed world-building, concept art, artstation" },
  { id: "pixel",       label: "👾 Pixel Art",  cor: "#fbbf24", corBg: "rgba(251,191,36,.12)",  sufixo: ", pixel art, 16-bit retro game style, crisp pixels, limited color palette, indie game aesthetic" },
  { id: "minimalista", label: "◻ Minimal",     cor: "#94a3b8", corBg: "rgba(148,163,184,.12)", sufixo: ", minimalist design, clean composition, simple shapes, white background, modern, elegant" }
];

/* ---------- PROMPTS PRONTOS ---------- */
const PROMPTS_PRONTOS = [
  { emoji: "🌆", label: "Cidade Neon",    prompt: "Futuristic neon-lit cyberpunk city at night, rain reflections on wet streets, towering skyscrapers with glowing signs, flying vehicles, fog, cinematic" },
  { emoji: "🐉", label: "Dragão",         prompt: "Majestic dragon perched on a mountain peak at sunset, scales shimmering in gold and crimson, wings spread wide, dramatic clouds, epic fantasy" },
  { emoji: "🌊", label: "Oceano",         prompt: "Underwater kingdom with bioluminescent coral reefs, schools of exotic fish, ancient sunken ruins covered in algae, rays of light piercing deep water" },
  { emoji: "🤖", label: "Robô",           prompt: "Hyper-detailed humanoid robot with transparent chest revealing glowing circuits, sleek silver surface, dramatic studio lighting, sci-fi concept art" },
  { emoji: "🌸", label: "Jardim",         prompt: "Magical japanese garden in cherry blossom season, stone lanterns, koi pond with reflections, soft morning mist, peaceful and ethereal atmosphere" },
  { emoji: "🧠", label: "IA",             prompt: "Abstract visualization of artificial intelligence, glowing neural network nodes, data streams, deep space background, blue and purple energy pulses" },
  { emoji: "⚔️", label: "Guerreiro",      prompt: "Armored warrior standing before a burning fortress at dusk, battle-worn sword raised, dramatic backlighting, smoke and embers in the air, heroic" },
  { emoji: "🌌", label: "Galáxia",        prompt: "Stunning nebula with swirling colors of purple, blue and orange, distant stars, a lone astronaut floating in silence, vast cosmic scale" },
  { emoji: "🏔️", label: "Montanha",       prompt: "Snow-capped mountain range at golden hour, dramatic clouds, pine forests below, crystal clear alpine lake reflection, photorealistic landscape" },
  { emoji: "🦊", label: "Raposa Mística", prompt: "Nine-tailed mystical fox spirit glowing with ethereal blue fire, floating in a moonlit bamboo forest, ancient Japanese mythology, painterly style" },
];

/* ---------- QUOTA ---------- */
const LS_QUOTA  = "sar_img_quota_v2";
const LIMITE    = 4;
const JANELA_MS = 60 * 60 * 1000;

function quotaVazia() { return { usado: 0, inicio: Date.now() }; }
function carregarQuota() {
  try {
    const raw = localStorage.getItem(LS_QUOTA);
    if (!raw) return quotaVazia();
    const q = JSON.parse(raw);
    if (!q.inicio || Date.now() - q.inicio >= JANELA_MS) {
      const nova = quotaVazia();
      localStorage.setItem(LS_QUOTA, JSON.stringify(nova));
      return nova;
    }
    return q;
  } catch { return quotaVazia(); }
}
function salvarQuota(q) { localStorage.setItem(LS_QUOTA, JSON.stringify(q)); }
function restante() { return Math.max(0, LIMITE - carregarQuota().usado); }
function consumir() { const q = carregarQuota(); q.usado++; salvarQuota(q); }
function tempoReset() {
  try {
    const q = JSON.parse(localStorage.getItem(LS_QUOTA));
    if (!q?.inicio) return "1h";
    const r = Math.max(0, JANELA_MS - (Date.now() - q.inicio));
    const m = Math.floor(r / 60000), s = Math.floor((r % 60000) / 1000);
    return m > 0 ? `${m}min` : `${s}s`;
  } catch { return "1h"; }
}

/* ---------- ELEMENTOS ---------- */
const gallery    = document.getElementById("gallery");
const emptyState = document.getElementById("emptyState");
const promptEl   = document.getElementById("prompt");
const genBtn     = document.getElementById("genBtn");
const quotaPill  = document.getElementById("quotaPill");
const toastEl    = document.getElementById("toast");
const styleRow   = document.getElementById("styleRow");
const promptsRow = document.getElementById("promptsRow");

let estiloAtivo = "nenhum";
let gerando = false;
let cardAtual = null; // referência ao único card visível

/* ---------- TOAST ---------- */
let _toastTimer = null;
function showToast(msg, isError = false) {
  toastEl.textContent = msg;
  toastEl.className = "toast" + (isError ? " error" : "");
  requestAnimationFrame(() => toastEl.classList.add("show"));
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200);
}

/* ---------- QUOTA UI ---------- */
function atualizarQuotaUI() {
  const r = restante();
  quotaPill.textContent = `${r} / ${LIMITE} gerações`;
  quotaPill.className = "quota-pill" + (r <= 1 ? " low" : "");
  genBtn.disabled = gerando || r <= 0;
}

/* ---------- CHIPS DE ESTILO ---------- */
function renderEstilos() {
  styleRow.innerHTML = "";
  ESTILOS.forEach(e => {
    const chip = document.createElement("button");
    chip.className = "style-chip" + (e.id === estiloAtivo ? " active" : "");
    chip.textContent = e.label;
    if (e.id === estiloAtivo) {
      chip.style.background = e.corBg;
      chip.style.borderColor = e.cor + "70";
      chip.style.color = e.cor;
    }
    chip.onclick = () => { estiloAtivo = e.id; renderEstilos(); };
    styleRow.appendChild(chip);
  });
}

/* ---------- CHIPS DE PROMPTS PRONTOS ---------- */
function renderPrompts() {
  promptsRow.innerHTML = "";
  PROMPTS_PRONTOS.forEach(p => {
    const chip = document.createElement("button");
    chip.className = "prompt-chip";
    chip.innerHTML = `<span class="prompt-chip-emoji">${p.emoji}</span><span>${p.label}</span>`;
    chip.onclick = () => {
      promptEl.value = p.prompt;
      promptEl.focus();
      // feedback visual
      document.querySelectorAll(".prompt-chip").forEach(c => c.classList.remove("selected"));
      chip.classList.add("selected");
    };
    promptsRow.appendChild(chip);
  });
}

/* ---------- URL POLLINATIONS ---------- */
function buildURL(promptTexto) {
  const estilo = ESTILOS.find(e => e.id === estiloAtivo);
  const promptFinal = promptTexto + (estilo?.sufixo || "");
  const seed = Math.floor(Math.random() * 999999);
  return `https://image.pollinations.ai/prompt/${encodeURIComponent(promptFinal)}?width=768&height=768&seed=${seed}&model=flux&nologo=true&enhance=true`;
}

/* ---------- URL → BASE64 ---------- */
async function urlParaBase64(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
        canvas.getContext("2d").drawImage(img, 0, 0);
        resolve(canvas.toDataURL("image/jpeg", 0.87));
      } catch(e) { reject(e); }
    };
    img.onerror = reject;
    img.src = url;
  });
}

/* ---------- SKELETON ---------- */
function criarSkeleton() {
  const card = document.createElement("div");
  card.className = "skeleton-card";
  card.innerHTML = `
    <div class="skeleton-img">
      <div class="skeleton-shimmer"></div>
      <div class="skeleton-orbs"><span></span><span></span><span></span></div>
      <div class="skeleton-label">Gerando imagem…</div>
    </div>
    <div class="skeleton-body">
      <div class="skeleton-line" style="width:72%"></div>
      <div class="skeleton-line" style="width:46%"></div>
    </div>`;
  return card;
}

/* ---------- CARD FINAL ---------- */
function criarCard(url, base64, promptTexto, estiloId) {
  const estilo = ESTILOS.find(e => e.id === estiloId) || ESTILOS[0];
  const card = document.createElement("div");
  card.className = "img-card";

  const img = document.createElement("img");
  img.src = url; img.alt = promptTexto;
  img.style.cssText = "opacity:0;transform:scale(.97);filter:blur(4px);transition:none;";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    img.style.transition = "opacity .5s ease, transform .5s ease, filter .5s ease";
    img.style.opacity = "1"; img.style.transform = "scale(1)"; img.style.filter = "blur(0)";
  }));

  const body = document.createElement("div");
  body.className = "img-card-body";

  const promptDiv = document.createElement("div");
  promptDiv.className = "img-card-prompt";
  promptDiv.textContent = `"${promptTexto}"`;

  const meta = document.createElement("div");
  meta.className = "img-card-meta";

  const styleTag = document.createElement("span");
  styleTag.className = "img-card-style";
  styleTag.textContent = estilo.label;
  styleTag.style.background = estilo.corBg;
  styleTag.style.color = estilo.cor;
  styleTag.style.border = `1px solid ${estilo.cor}40`;

  const actions = document.createElement("div");
  actions.className = "img-card-actions";

  const dlBtn = document.createElement("button");
  dlBtn.className = "dl-btn";
  dlBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v8M4 6l3 3 3-3M2 11h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Baixar`;
  dlBtn.onclick = () => {
    const a = document.createElement("a");
    a.href = base64 || url; a.download = `SAR_imagine_${Date.now()}.jpg`; a.click();
    dlBtn.innerHTML = `✓ Baixado`;
    setTimeout(() => { dlBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v8M4 6l3 3 3-3M2 11h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Baixar`; }, 2500);
  };

  meta.appendChild(styleTag);
  actions.appendChild(dlBtn);
  body.appendChild(promptDiv);
  body.appendChild(meta);
  body.appendChild(actions);
  card.appendChild(img);
  card.appendChild(body);
  return card;
}

/* ---------- REMOVER CARD ANTERIOR ---------- */
function removerCardAtual(cb) {
  if (!cardAtual) { cb(); return; }
  const old = cardAtual;
  cardAtual = null;
  old.style.transition = "opacity .22s ease, transform .22s ease";
  old.style.opacity = "0";
  old.style.transform = "scale(.96) translateY(-8px)";
  setTimeout(() => { old.remove(); cb(); }, 230);
}

/* ---------- GERAR ---------- */
async function gerar() {
  const txt = promptEl.value.trim();
  if (!txt) { showToast("Descreva a imagem primeiro.", true); return; }
  if (restante() <= 0) { showToast(`Limite atingido. Tente em ${tempoReset()}.`, true); return; }
  if (gerando) return;

  gerando = true;
  genBtn.disabled = true;
  promptEl.disabled = true;
  document.querySelectorAll(".prompt-chip").forEach(c => c.classList.remove("selected"));

  const estiloUsado = estiloAtivo;
  const url = buildURL(txt);

  // Remove card anterior, depois insere skeleton
  removerCardAtual(() => {
    emptyState.style.display = "none";
    const skeleton = criarSkeleton();
    gallery.appendChild(skeleton);
    gallery.scrollTop = gallery.scrollHeight;

    // Carrega imagem
    const img = new Image();
    img.onload = async () => {
      consumir();
      atualizarQuotaUI();

      let base64 = url;
      try { base64 = await urlParaBase64(url); } catch {}

      const card = criarCard(url, base64, txt, estiloUsado);
      skeleton.replaceWith(card);
      cardAtual = card;
      gallery.scrollTop = gallery.scrollHeight;
      promptEl.value = "";
      gerando = false;
      promptEl.disabled = false;
      atualizarQuotaUI();
      promptEl.focus();
    };
    img.onerror = () => {
      skeleton.remove();
      if (!cardAtual) emptyState.style.display = "";
      showToast("Erro ao gerar imagem. Tente novamente.", true);
      gerando = false;
      promptEl.disabled = false;
      atualizarQuotaUI();
    };
    img.src = url;
  });
}

/* ---------- EVENTOS ---------- */
genBtn.onclick = gerar;
promptEl.addEventListener("keypress", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); gerar(); }
});

/* ---------- INIT ---------- */
renderEstilos();
renderPrompts();
atualizarQuotaUI();
</script>
