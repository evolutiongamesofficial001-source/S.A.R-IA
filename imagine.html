<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#060609">
  <title>S.A.R Imagine — Evolution Games Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #060609;
      --surface:   #0c0c14;
      --surface-2: #111119;
      --surface-3: #17172a;
      --border:    rgba(255,255,255,.07);
      --border-2:  rgba(255,255,255,.13);
      --accent:    #7c6aff;
      --accent-2:  #b8aaff;
      --accent-3:  #4ade80;
      --accent-glow: rgba(124,106,255,.25);
      --text:      #eeeeff;
      --text-2:    #8888b0;
      --text-3:    #44445a;
      --red:       #f87171;
      --radius:    16px;
      --radius-sm: 10px;
      --font:      'Syne', sans-serif;
      --mono:      'DM Mono', monospace;
      --header-h:  60px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body {
      width:100%; height:100%;
      background:var(--bg); color:var(--text);
      font-family:var(--font); overflow:hidden;
      font-size:15px; -webkit-font-smoothing:antialiased;
    }

    /* ===== SHELL ===== */
    .app {
      width:100%; height:100dvh;
      max-width:520px; margin:auto;
      display:flex; flex-direction:column;
      background:var(--surface);
      border-left:1px solid var(--border);
      border-right:1px solid var(--border);
      position:relative; overflow:hidden;
    }

    /* ===== HEADER ===== */
    header {
      height:var(--header-h);
      display:flex; align-items:center;
      padding:0 14px; gap:10px;
      border-bottom:1px solid var(--border);
      background:rgba(12,12,20,.94);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      flex-shrink:0; z-index:10;
    }
    .back-btn {
      display:flex; align-items:center; gap:6px;
      background:none; border:1px solid var(--border);
      color:var(--text-2); font-family:var(--font);
      font-size:.72rem; font-weight:600;
      padding:7px 11px; border-radius:var(--radius-sm);
      cursor:pointer; transition:all .2s; text-decoration:none;
      flex-shrink:0; letter-spacing:.04em;
    }
    .back-btn:hover { border-color:var(--accent); color:var(--accent-2); background:rgba(124,106,255,.08); }
    .header-center { flex:1; display:flex; flex-direction:column; align-items:center; }
    .header-title {
      font-size:.92rem; font-weight:800;
      letter-spacing:.12em; text-transform:uppercase;
      background:linear-gradient(135deg,#b8aaff 0%,#7c6aff 55%,#4ade80 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .header-sub { font-size:.56rem; color:var(--text-3); letter-spacing:.1em; text-transform:uppercase; }
    .quota-pill {
      font-size:.62rem; color:var(--text-3); font-family:var(--mono);
      background:var(--surface-3); border:1px solid var(--border);
      padding:5px 10px; border-radius:20px;
      flex-shrink:0; white-space:nowrap;
      transition:color .3s, border-color .3s;
    }
    .quota-pill.low { color:var(--red); border-color:rgba(248,113,113,.3); }

    /* ===== GALLERY ===== */
    .gallery {
      flex:1; overflow-y:auto; overflow-x:hidden;
      padding:16px 14px 10px;
      display:flex; flex-direction:column; gap:16px;
      scrollbar-width:thin; scrollbar-color:var(--border) transparent;
    }
    .gallery::-webkit-scrollbar { width:3px; }
    .gallery::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:999px; }

    /* Empty state */
    .empty-state {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:16px; padding:40px 24px;
      text-align:center; pointer-events:none;
      animation:fadeIn .5s ease;
      min-height:220px;
    }
    .empty-icon {
      width:72px; height:72px;
      background:var(--surface-2);
      border:1px solid var(--border);
      border-radius:22px;
      display:flex; align-items:center; justify-content:center;
      position:relative;
      animation:emptyFloat 3s ease-in-out infinite;
    }
    @keyframes emptyFloat {
      0%,100% { transform:translateY(0); }
      50%      { transform:translateY(-6px); }
    }
    .empty-icon::after {
      content:'';
      position:absolute; inset:-1px; border-radius:22px;
      background:linear-gradient(135deg,rgba(124,106,255,.18),transparent);
      pointer-events:none;
    }
    .empty-icon svg { opacity:.3; }
    .empty-title { font-size:.95rem; font-weight:700; color:var(--text-2); letter-spacing:.04em; }
    .empty-desc { font-size:.74rem; color:var(--text-3); line-height:1.6; max-width:270px; }

    /* ===== IMAGE CARD ===== */
    .img-card {
      background:var(--surface-2);
      border:1px solid var(--border);
      border-radius:20px;
      overflow:hidden;
      animation:cardIn .45s cubic-bezier(.22,1,.36,1) forwards;
      position:relative;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(22px) scale(.95); }
      to   { opacity:1; transform:none; }
    }

    /* Image wrapper with persistent download overlay */
    .img-wrapper {
      position:relative;
      overflow:hidden;
    }
    .img-wrapper img {
      width:100%; display:block;
      object-fit:cover;
    }
    /* Download overlay — sempre visível */
    .img-overlay {
      position:absolute;
      bottom:0; left:0; right:0;
      padding:30px 12px 12px;
      background:linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.4) 60%, transparent 100%);
      display:flex; align-items:flex-end; justify-content:space-between; gap:8px;
    }
    .overlay-dl-btn {
      display:flex; align-items:center; gap:7px;
      padding:9px 18px;
      border-radius:12px;
      font-size:.78rem; font-weight:700;
      font-family:var(--font); cursor:pointer;
      background:var(--accent);
      border:none; color:#fff;
      box-shadow:0 4px 18px var(--accent-glow);
      transition:all .18s; letter-spacing:.04em;
      flex:1; justify-content:center;
    }
    .overlay-dl-btn:hover { background:#9370ff; transform:translateY(-1px); box-shadow:0 6px 26px var(--accent-glow); }
    .overlay-dl-btn:active { transform:scale(.92); }
    .overlay-dl-btn.done { background:var(--accent-3); box-shadow:0 4px 18px rgba(74,222,128,.3); }
    .overlay-share-btn {
      width:40px; height:40px;
      border-radius:12px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.18);
      color:#fff; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:all .18s; flex-shrink:0;
      backdrop-filter:blur(8px);
    }
    .overlay-share-btn:hover { background:rgba(255,255,255,.2); }
    .overlay-share-btn:active { transform:scale(.9); }

    /* Style badge on image */
    .img-style-badge {
      position:absolute; top:10px; left:10px;
      font-size:.6rem; font-weight:700;
      padding:4px 10px; border-radius:20px;
      letter-spacing:.06em; text-transform:uppercase;
      backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,.12);
    }

    .img-card-body { padding:10px 14px 12px; display:flex; flex-direction:column; gap:6px; }
    .img-card-prompt {
      font-size:.69rem; color:var(--text-3);
      line-height:1.5; font-family:var(--mono);
    }

    /* ===== SKELETON — NOVA ANIMAÇÃO ===== */
    .skeleton-card {
      background:var(--surface-2);
      border:1px solid rgba(124,106,255,.2);
      border-radius:20px; overflow:hidden;
      animation:cardIn .2s ease;
      box-shadow:0 0 0 1px rgba(124,106,255,.05), 0 0 40px rgba(124,106,255,.06);
    }
    .skeleton-img {
      width:100%; aspect-ratio:1;
      background:var(--surface-3);
      position:relative; overflow:hidden;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:24px;
    }

    /* Fundo animado com partículas */
    .sk-bg {
      position:absolute; inset:0;
      background:
        radial-gradient(ellipse 60% 40% at 30% 40%, rgba(124,106,255,.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 60% at 70% 60%, rgba(74,222,128,.05) 0%, transparent 70%);
      animation:skBgPulse 3s ease-in-out infinite alternate;
    }
    @keyframes skBgPulse {
      from { opacity:.6; transform:scale(1); }
      to   { opacity:1;  transform:scale(1.04); }
    }

    /* Shimmer diagonal */
    .sk-shimmer {
      position:absolute; inset:0;
      background:linear-gradient(115deg, transparent 20%, rgba(124,106,255,.07) 45%, rgba(184,170,255,.12) 50%, rgba(124,106,255,.07) 55%, transparent 80%);
      background-size:300% 100%;
      animation:skShimmer 2.2s ease-in-out infinite;
    }
    @keyframes skShimmer {
      0%   { background-position:200% 0; }
      100% { background-position:-100% 0; }
    }

    /* Anel principal com raios */
    .sk-ring-wrap {
      position:relative; width:72px; height:72px; z-index:2;
    }
    .sk-ring-outer {
      position:absolute; inset:0;
      border-radius:50%;
      border:2px solid rgba(124,106,255,.12);
      border-top-color:var(--accent);
      border-right-color:rgba(184,170,255,.5);
      animation:skSpin 1.1s cubic-bezier(.6,.2,.4,.8) infinite;
    }
    .sk-ring-inner {
      position:absolute; inset:10px;
      border-radius:50%;
      border:1.5px solid rgba(124,106,255,.07);
      border-bottom-color:var(--accent-2);
      animation:skSpin 1.7s cubic-bezier(.5,.1,.5,.9) infinite reverse;
    }
    .sk-ring-dot {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
    }
    .sk-ring-dot::after {
      content:'';
      width:8px; height:8px; border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 12px var(--accent), 0 0 24px var(--accent-glow);
      animation:skDotPulse 1.1s ease-in-out infinite;
    }
    @keyframes skSpin { to { transform:rotate(360deg); } }
    @keyframes skDotPulse {
      0%,100% { opacity:.6; transform:scale(.8); }
      50%     { opacity:1;  transform:scale(1.2); }
    }

    /* Texto de status + progresso */
    .sk-status { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:10px; }
    .sk-label {
      font-size:.72rem; color:var(--accent-2);
      font-family:var(--mono); letter-spacing:.1em;
      animation:skLabelFade 2s ease-in-out infinite;
    }
    @keyframes skLabelFade {
      0%,100% { opacity:.5; }
      50%     { opacity:1; }
    }
    .sk-progress-track {
      width:100px; height:2px;
      background:rgba(255,255,255,.06);
      border-radius:99px; overflow:hidden;
    }
    .sk-progress-bar {
      height:100%; width:0%;
      background:linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius:99px;
      box-shadow:0 0 8px var(--accent-glow);
      transition:width .4s ease;
    }

    /* Partículas flutuantes */
    .sk-particles { position:absolute; inset:0; z-index:1; pointer-events:none; }
    .sk-p {
      position:absolute;
      width:3px; height:3px; border-radius:50%;
      background:var(--accent);
      animation:skFloat var(--dur) ease-in-out infinite;
      animation-delay:var(--delay);
      left:var(--x); top:var(--y);
      opacity:0;
    }
    @keyframes skFloat {
      0%   { opacity:0;    transform:translateY(0) scale(0); }
      20%  { opacity:.7;   transform:translateY(-8px) scale(1); }
      80%  { opacity:.4;   transform:translateY(-24px) scale(.6); }
      100% { opacity:0;    transform:translateY(-40px) scale(0); }
    }

    .skeleton-body { padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
    .skeleton-line {
      height:9px; border-radius:6px;
      background:var(--surface-3);
      background:linear-gradient(90deg, var(--surface-3) 0%, rgba(124,106,255,.08) 50%, var(--surface-3) 100%);
      background-size:200% 100%;
      animation:skShimmer 1.8s ease-in-out infinite;
    }

    /* ===== PROMPTS / STYLES ===== */
    .section-label {
      font-size:.58rem; font-weight:700;
      color:var(--text-3); letter-spacing:.12em;
      text-transform:uppercase;
    }
    .chips-row {
      display:flex; gap:6px;
      overflow-x:auto; padding-bottom:2px;
      scrollbar-width:none;
    }
    .chips-row::-webkit-scrollbar { display:none; }
    .prompt-chip {
      flex-shrink:0; display:flex; align-items:center; gap:5px;
      padding:6px 12px; border-radius:20px;
      border:1px solid var(--border);
      background:none; color:var(--text-2);
      font-family:var(--font); font-size:.7rem; font-weight:600;
      cursor:pointer; transition:all .18s; white-space:nowrap;
    }
    .prompt-chip:hover { border-color:var(--border-2); color:var(--text); background:var(--surface-3); }
    .prompt-chip.selected { background:rgba(124,106,255,.13); border-color:rgba(124,106,255,.4); color:var(--accent-2); }
    .prompt-chip-emoji { font-size:.88rem; }
    .style-chip {
      flex-shrink:0; padding:6px 13px;
      border-radius:20px; border:1px solid var(--border);
      background:none; color:var(--text-2);
      font-family:var(--font); font-size:.7rem; font-weight:600;
      cursor:pointer; transition:all .18s; white-space:nowrap;
    }
    .style-chip:hover { border-color:var(--border-2); color:var(--text); }

    /* ===== INPUT BAR ===== */
    .input-bar {
      flex-shrink:0;
      border-top:1px solid var(--border);
      background:rgba(12,12,20,.97);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      padding:10px 14px 14px;
      display:flex; flex-direction:column; gap:9px;
    }

    /* Resolution — removido da UI, fixo em 768x768 */

    /* Input wrap */
    .input-wrap {
      display:flex; align-items:center; gap:8px;
      background:var(--surface-2);
      border:1px solid var(--border-2);
      border-radius:var(--radius);
      padding:6px 6px 6px 12px;
      transition:border-color .2s, box-shadow .2s;
    }
    .input-wrap:focus-within {
      border-color:var(--accent);
      box-shadow:0 0 0 3px var(--accent-glow);
    }
    #prompt {
      flex:1; background:none; border:none;
      color:var(--text); font-size:.86rem;
      font-family:var(--font); outline:none;
      padding:8px 0; min-height:36px;
    }
    #prompt::placeholder { color:var(--text-3); }
    .gen-btn {
      width:40px; height:40px; border-radius:11px;
      border:none; background:var(--accent);
      color:#fff; cursor:pointer; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      transition:transform .15s, box-shadow .2s, background .2s;
      box-shadow:0 4px 16px var(--accent-glow);
    }
    .gen-btn:hover { filter:brightness(1.15); transform:scale(1.05); box-shadow:0 6px 24px var(--accent-glow); }
    .gen-btn:active { transform:scale(.9); }
    .gen-btn:disabled { opacity:.4; cursor:not-allowed; transform:none !important; }

    /* ===== TOAST ===== */
    .toast {
      position:absolute; bottom:90px;
      left:50%; transform:translateX(-50%) translateY(10px);
      background:var(--surface-3); border:1px solid var(--border-2);
      border-radius:12px; padding:10px 18px;
      font-size:.75rem; color:var(--text-2);
      white-space:nowrap; z-index:200;
      opacity:0; pointer-events:none;
      transition:opacity .22s, transform .22s;
      box-shadow:0 8px 28px rgba(0,0,0,.6);
      font-family:var(--mono);
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.error   { color:var(--red);      border-color:rgba(248,113,113,.3); }
    .toast.success { color:var(--accent-3); border-color:rgba(74,222,128,.3); }

    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  </style>
</head>

  <!-- HEADER -->
  <header>
    <a href="index.html" class="back-btn" aria-label="Voltar">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M7.5 2L3 6 7.5 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <div class="header-center">

  <div class="gallery" id="gallery">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none"><rect x="2" y="2" width="26" height="26" rx="5" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.5" fill="currentColor"/><path d="M2 20l7-7 5.5 5.5L21 11.5l7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <!-- INPUT BAR -->
  <div class="input-bar">
    <div class="section-label">Inspirações</div>

    <!-- Prompt -->
    <div class="input-wrap">
      <input id="prompt" placeholder="Descreva a imagem que deseja gerar…" autocomplete="off" spellcheck="false">

      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

  { emoji:"🦊", label:"Kitsune",     prompt:"Nine-tailed fox spirit with iridescent ghostly flames, floating through a moonlit ancient bamboo forest, sacred shrine behind it, traditional sumi-e ink painting style" },
  { emoji:"🏔️", label:"Paisagem",   prompt:"Alien planet with twin moons rising over crystalline mountain ranges, floating islands connected by waterfalls of liquid light, bioluminescent vegetation, breathtaking scale" },
];

/* ---------- QUOTA ---------- */
const LS_QUOTA  = "sar_img_quota_v3";
const LIMITE    = 6;
const JANELA_MS = 60 * 60 * 1000;
function quotaVazia()   { return { usado:0, inicio:Date.now() }; }
function carregarQuota() {
  try {
    const raw = localStorage.getItem(LS_QUOTA);
    if (!raw) return quotaVazia();
    const q = JSON.parse(raw);
    if (!q.inicio || Date.now()-q.inicio >= JANELA_MS) {
      const n = quotaVazia(); localStorage.setItem(LS_QUOTA, JSON.stringify(n)); return n;
    }
    return q;
  } catch { return quotaVazia(); }
}
function salvarQuota(q)  { localStorage.setItem(LS_QUOTA, JSON.stringify(q)); }
function restante()       { return Math.max(0, LIMITE - carregarQuota().usado); }
function consumir()       { const q = carregarQuota(); q.usado++; salvarQuota(q); }
function tempoReset() {
  try {
    const q = JSON.parse(localStorage.getItem(LS_QUOTA));
    if (!q?.inicio) return "1h";
    const r = Math.max(0, JANELA_MS-(Date.now()-q.inicio));
    const m = Math.floor(r/60000), s = Math.floor((r%60000)/1000);
    return m > 0 ? `${m}min` : `${s}s`;
  } catch { return "1h"; }
}

/* ---------- ELEMENTS ---------- */
const gallery    = document.getElementById("gallery");
const emptyState = document.getElementById("emptyState");
const promptEl   = document.getElementById("prompt");
const genBtn     = document.getElementById("genBtn");
const quotaPill  = document.getElementById("quotaPill");
const toastEl    = document.getElementById("toast");
const styleRow   = document.getElementById("styleRow");
const promptsRow = document.getElementById("promptsRow");

let estiloAtivo = "livre";
let gerando = false;
let cardAtual = null;
const resW = 768, resH = 768; // fixo

/* ---------- TOAST ---------- */
let _toastTimer = null;
function showToast(msg, tipo="") {
  toastEl.textContent = msg;
  toastEl.className = "toast" + (tipo ? " "+tipo : "");
  requestAnimationFrame(() => toastEl.classList.add("show"));
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200);
}

/* ---------- QUOTA UI ---------- */
function atualizarQuotaUI() {
  const r = restante();
  quotaPill.textContent = `${r} / ${LIMITE} gerações`;
  quotaPill.className = "quota-pill" + (r <= 1 ? " low" : "");
  genBtn.disabled = gerando || r <= 0;
}

/* ---------- ESTILOS ---------- */
function renderEstilos() {
  styleRow.innerHTML = "";
  ESTILOS.forEach(e => {
    const chip = document.createElement("button");
    chip.className = "style-chip" + (e.id === estiloAtivo ? " active" : "");

      chip.style.color       = e.cor;
    }
    chip.onclick = () => { estiloAtivo = e.id; renderEstilos(); };
    styleRow.appendChild(chip);
  });
}

/* ---------- PROMPTS PRONTOS ---------- */
function renderPrompts() {
  promptsRow.innerHTML = "";
  PROMPTS_PRONTOS.forEach(p => {
    const chip = document.createElement("button");
    chip.className = "prompt-chip";
    chip.innerHTML = `<span class="prompt-chip-emoji">${p.emoji}</span><span>${p.label}</span>`;
    chip.onclick = () => {
      promptEl.value = p.prompt; promptEl.focus();
      document.querySelectorAll(".prompt-chip").forEach(c => c.classList.remove("selected"));
      chip.classList.add("selected");
    };
    promptsRow.appendChild(chip);
  });
}

/* ---------- GEMINI SDK — chave em ROT13 ---------- */
import { GoogleGenAI } from "@google/genai";

function rot13(s) {
  return s.replace(/[A-Za-z]/g, c => {
    const b = c <= 'Z' ? 65 : 97;
    return String.fromCharCode(((c.charCodeAt(0) - b + 13) % 26) + b);
  });
}
// Chave ROT13 — substitua pelo valor codificado da sua chave real
const _GK = rot13("ND.No8EA6W8qV1_IVJ28Nh4VnZ7tfYgu1EH7TCmYcEBVR5SVnRSED");   // ← coloque aqui sua chave Google em ROT13

async function gerarImagemGemini(texto) {
  const estilo = ESTILOS.find(e => e.id === estiloAtivo);
  const promptFinal = texto + (estilo?.sufixo || "");
  const ai = new GoogleGenAI({ apiKey: _GK });
  const resp = await ai.models.generateContent({
    model: "gemini-2.0-flash-preview-image-generation",
    contents: promptFinal,
    config: { responseModalities: ["IMAGE", "TEXT"] }
  });
  const parts = resp?.candidates?.[0]?.content?.parts || [];
  const imgPart = parts.find(p => p.inlineData?.mimeType?.startsWith("image/"));
  if (!imgPart) throw new Error("Sem imagem na resposta");
  return `data:${imgPart.inlineData.mimeType};base64,${imgPart.inlineData.data}`;
}

/* ---------- DOWNLOAD REAL (fetch + blob) ---------- */
async function downloadImagem(url, btn) {
  btn.disabled = true;
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="animation:skSpin .8s linear infinite"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="20 14"/></svg> Baixando…`;
  try {
    let blobUrl;
    if (url.startsWith("data:")) {
      // Base64 data URL (Gemini) — converte direto para blob
      const res = await fetch(url);
      const blob = await res.blob();
      blobUrl = URL.createObjectURL(blob);
    } else {
      const resp = await fetch(url, { mode: "cors" });
      if (!resp.ok) throw new Error("fetch failed");
      const blob = await resp.blob();
      blobUrl = URL.createObjectURL(blob);
    }
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = `SAR_imagine_${Date.now()}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
    btn.classList.add("done");
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l3.5 3.5L12 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Baixado!`;
    setTimeout(() => {
      btn.classList.remove("done");
      btn.disabled = false;
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v8M4.5 6.5L7 9l2.5-2.5M1.5 12h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Baixar`;
    }, 3000);
  } catch {
    const a = document.createElement("a");
    a.href = url; a.download = `SAR_imagine_${Date.now()}.png`; a.target="_blank";
    a.click();
    btn.disabled = false;
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v8M4.5 6.5L7 9l2.5-2.5M1.5 12h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Baixar`;
    showToast("Abrindo imagem para salvar…", "");
  }
}

/* ---------- SKELETON COM PROGRESSO ---------- */
function criarSkeleton(ar) {
  const card = document.createElement("div");
  card.className = "skeleton-card";
  // Gera partículas
  const particles = Array.from({length:12}, (_,i) => {
    const x = 10 + Math.random()*80;
    const y = 20 + Math.random()*60;
    const dur = 2 + Math.random()*2;
    const delay = Math.random()*2;
    return `<div class="sk-p" style="--x:${x}%;--y:${y}%;--dur:${dur}s;--delay:${delay}s"></div>`;
  }).join("");

  card.innerHTML = `
    <div class="skeleton-img" style="aspect-ratio:${ar || '1'}">
      <div class="sk-bg"></div>
      <div class="sk-shimmer"></div>
      <div class="sk-particles">${particles}</div>
      <div class="sk-ring-wrap">
        <div class="sk-ring-outer"></div>
        <div class="sk-ring-inner"></div>
        <div class="sk-ring-dot"></div>
      </div>
      <div class="sk-status">
        <div class="sk-label" id="skLabel">Inicializando…</div>
        <div class="sk-progress-track"><div class="sk-progress-bar" id="skBar"></div></div>
      </div>
    </div>
    <div class="skeleton-body">
      <div class="skeleton-line" style="width:68%"></div>
      <div class="skeleton-line" style="width:42%"></div>
    </div>`;
  return card;
}

/* Animação de progresso falso */
function animarProgresso(card) {
  const bar   = card.querySelector("#skBar");
  const label = card.querySelector("#skLabel");
  if (!bar || !label) return;
  const etapas = [
    { p: 8,  t:"Inicializando…" },
    { p: 22, t:"Processando prompt…" },
    { p: 40, t:"Gerando composição…" },
    { p: 58, t:"Renderizando detalhes…" },
    { p: 74, t:"Aplicando estilo…" },
    { p: 88, t:"Finalizando…" },
    { p: 96, t:"Quase pronto…" },
  ];
  let i = 0;
  const tick = () => {
    if (i >= etapas.length) return;
    bar.style.width   = etapas[i].p + "%";
    label.textContent = etapas[i].t;
    i++;
    setTimeout(tick, 900 + Math.random()*600);
  };
  setTimeout(tick, 300);
}

/* ---------- CARD FINAL ---------- */
function criarCard(url, promptTexto, estiloId, ar) {
  const estilo = ESTILOS.find(e => e.id === estiloId) || ESTILOS[0];
  const card = document.createElement("div");
  card.className = "img-card";

  /* Wrapper da imagem */
  const wrapper = document.createElement("div");
  wrapper.className = "img-wrapper";

  const img = document.createElement("img");
  img.src = url; img.alt = promptTexto;
  if (ar) img.style.aspectRatio = ar;
  img.style.cssText += ";opacity:0;transform:scale(.96);filter:blur(8px);transition:none;";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    img.style.transition = "opacity .7s ease, transform .7s ease, filter .7s ease";
    img.style.opacity = "1"; img.style.transform = "scale(1)"; img.style.filter = "blur(0)";
  }));

  /* Badge de estilo sobre a imagem */
  const badge = document.createElement("div");
  badge.className = "img-style-badge";
  badge.textContent = estilo.label;
  badge.style.background  = estilo.corBg;
  badge.style.color       = estilo.cor;
  badge.style.borderColor = estilo.cor+"30";

  /* Overlay com botão de download SEMPRE visível */
  const overlay = document.createElement("div");
  overlay.className = "img-overlay";

  const dlBtn = document.createElement("button");
  dlBtn.className = "overlay-dl-btn";
  dlBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v8M4.5 6.5L7 9l2.5-2.5M1.5 12h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Baixar`;
  dlBtn.onclick = () => downloadImagem(url, dlBtn);

  /* Botão de compartilhar / abrir */
  const shareBtn = document.createElement("button");
  shareBtn.className = "overlay-share-btn";
  shareBtn.title = "Abrir em nova aba";
  shareBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M6 2H2.5A1.5 1.5 0 001 3.5v8A1.5 1.5 0 002.5 13h8A1.5 1.5 0 0012 11.5V8M9 1h4m0 0v4m0-4L6.5 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  shareBtn.onclick = () => { window.open(url, "_blank"); };

  overlay.appendChild(dlBtn);
  overlay.appendChild(shareBtn);
  wrapper.appendChild(img);
  wrapper.appendChild(badge);
  wrapper.appendChild(overlay);

  /* Corpo do card */
  const body = document.createElement("div");
  body.className = "img-card-body";
  const promptDiv = document.createElement("div");
  promptDiv.className = "img-card-prompt";
  promptDiv.textContent = `"${promptTexto}"`;
  body.appendChild(promptDiv);

  card.appendChild(wrapper);
  card.appendChild(body);
  return card;
}

/* ---------- REMOVER CARD ATUAL ---------- */
function removerCardAtual(cb) {
  if (!cardAtual) { cb(); return; }
  const old = cardAtual; cardAtual = null;
  old.style.transition = "opacity .22s ease, transform .22s ease";
  old.style.opacity = "0"; old.style.transform = "scale(.96) translateY(-8px)";
  setTimeout(() => { old.remove(); cb(); }, 240);
}

/* ---------- MELHORAR PROMPT VIA IA ---------- */
async function melhorarPrompt(texto) {
  const estilo = ESTILOS.find(e => e.id === estiloAtivo);
  const estiloNome = estilo ? estilo.label.replace(/[^\w\s]/g, "").trim() : "livre";
  try {
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: `You are an expert image prompt engineer for AI image generators like Stable Diffusion and FLUX.
Rewrite the following user prompt into a rich, detailed, evocative prompt optimized for high-quality image generation.
Style context: "${estiloNome}".
Rules:
- Keep the core subject and intent
- Add vivid visual details: lighting, atmosphere, composition, textures, colors
- Use powerful descriptive adjectives
- Keep it under 180 characters
- Output ONLY the improved prompt, no explanations, no quotes

User prompt: "${texto}"`
        }]
      })
    });
    const data = await resp.json();
    const melhorado = data?.content?.[0]?.text?.trim();
    return melhorado && melhorado.length > 5 ? melhorado : texto;
  } catch {
    return texto; // fallback: usa o original se falhar
  }
}

/* ---------- GERAR ---------- */
async function gerar() {
  const txt = promptEl.value.trim();
  if (!txt) { showToast("Descreva a imagem primeiro.", "error"); return; }
  if (restante() <= 0) { showToast(`Limite atingido. Tente em ${tempoReset()}.`, "error"); return; }
  if (gerando) return;

  gerando = true; genBtn.disabled = true; promptEl.disabled = true;
  document.querySelectorAll(".prompt-chip").forEach(c => c.classList.remove("selected"));

  const estiloUsado = estiloAtivo;
  const ar = `${resW} / ${resH}`;

  // Melhora o prompt antes de gerar
  showToast("✨ Melhorando prompt…", "");
  const txtMelhorado = await melhorarPrompt(txt);

  removerCardAtual(() => {
    emptyState.style.display = "none";
    const sk = criarSkeleton(ar);
    gallery.appendChild(sk);
    gallery.scrollTop = gallery.scrollHeight;
    animarProgresso(sk);

    gerarImagemGemini(txtMelhorado).then(dataUrl => {
      consumir(); atualizarQuotaUI();
      const bar = sk.querySelector("#skBar");
      const lbl = sk.querySelector("#skLabel");
      if (bar) bar.style.width = "100%";
      if (lbl) lbl.textContent = "Pronto!";

      setTimeout(() => {
        const card = criarCard(dataUrl, txtMelhorado, estiloUsado, ar);
        sk.replaceWith(card); cardAtual = card;
        gallery.scrollTop = gallery.scrollHeight;
        promptEl.value = "";
        gerando = false; promptEl.disabled = false; atualizarQuotaUI(); promptEl.focus();
        showToast("Imagem gerada!", "success");
      }, 350);
    }).catch(err => {
      sk.remove();
      if (!cardAtual) emptyState.style.display = "";
      showToast("Erro: " + (err.message || "Tente novamente."), "error");
      gerando = false; promptEl.disabled = false; atualizarQuotaUI();
    });
  });
}

/* ---------- EVENTOS ---------- */
genBtn.onclick = gerar;
promptEl.addEventListener("keypress", e => { if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();gerar();} });

/* ---------- INIT ---------- */
renderEstilos();
renderPrompts();
atualizarQuotaUI();
</script>
