<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#07040f">
  <title>S.A.R — Modo Voz</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#07040f; --surface:#0d0a1a; --border:rgba(255,255,255,.06);
      --accent:#7c6aff; --accent-2:#a78bfa; --accent-3:#c4b5fd;
      --glow:rgba(124,106,255,.35); --text:#f0f0ff; --text-2:#8080aa; --text-3:#3a3a5c;
      --red:#f87171; --green:#34d399;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;}

    .shell{width:100%;height:100dvh;max-width:480px;margin:auto;display:flex;flex-direction:column;align-items:center;background:var(--surface);position:relative;overflow:hidden;}

    .bg-glow{position:absolute;inset:0;pointer-events:none;z-index:0;}
    .bg-glow::before{content:"";position:absolute;top:10%;left:50%;transform:translateX(-50%);width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(124,106,255,.15) 0%,transparent 70%);transition:background 1.2s;}
    .bg-glow.listen::before{background:radial-gradient(circle,rgba(248,113,113,.2) 0%,transparent 70%);}
    .bg-glow.think::before {background:radial-gradient(circle,rgba(96,165,250,.15) 0%,transparent 70%);}
    .bg-glow.speak::before {background:radial-gradient(circle,rgba(167,139,250,.22) 0%,transparent 70%);}

    /* HEADER */
    .v-header{position:relative;z-index:10;width:100%;padding:14px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
    .v-back{display:flex;align-items:center;gap:7px;color:var(--text-2);text-decoration:none;font-size:13px;font-weight:500;padding:5px 10px;border-radius:8px;border:1px solid transparent;transition:color .2s,background .2s,border-color .2s;}
    .v-back:hover{color:var(--accent-2);background:rgba(124,106,255,.1);border-color:rgba(124,106,255,.2);}
    .v-logo{display:flex;align-items:center;gap:8px;}
    .v-logo-ring{position:relative;width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
    .v-logo-ring::before{content:"";position:absolute;inset:0;border:1.5px solid var(--accent);border-radius:50%;opacity:.5;animation:spin 8s linear infinite;}
    .v-logo-dot{width:7px;height:7px;background:var(--accent);border-radius:50%;box-shadow:0 0 8px var(--glow);animation:pulse 2.5s ease-in-out infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .v-logo-name{font-size:15px;font-weight:600;color:var(--accent-2);letter-spacing:.03em;}
    .v-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-3);background:rgba(255,255,255,.03);padding:4px 9px;border-radius:20px;border:1px solid var(--border);}
    .v-pill-dot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green);}

    #particleCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}

    /* CENTRO */
    .v-center{position:relative;z-index:10;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 24px 0;}

    .orb-space{width:220px;height:220px;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .orb-label{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;}
    .orb-emoji{font-size:36px;line-height:1;}
    .orb-state{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2);opacity:.7;transition:color .4s;}

    /* BOTÃO INICIAR — só pra pedir permissão na primeira vez */
    .start-btn{
      margin-top:26px;
      padding:14px 36px;border-radius:40px;
      border:1.5px solid var(--accent);
      background:rgba(124,106,255,.12);
      color:var(--accent-2);font-size:15px;font-weight:600;
      cursor:pointer;outline:none;letter-spacing:.02em;
      box-shadow:0 0 24px rgba(124,106,255,.2);
      transition:all .2s;
    }
    .start-btn:hover{background:rgba(124,106,255,.22);box-shadow:0 0 36px rgba(124,106,255,.35);}
    .start-btn:active{transform:scale(.96);}
    .start-btn.hidden{display:none;}

    /* INDICADOR DE VOLUME */
    .vol-ring{
      margin-top:22px;
      width:54px;height:54px;border-radius:50%;
      border:2px solid rgba(124,106,255,.2);
      display:flex;align-items:center;justify-content:center;
      transition:border-color .2s,box-shadow .2s;
      flex-shrink:0;
    }
    .vol-ring.active{border-color:var(--red);box-shadow:0 0 16px rgba(248,113,113,.4);}
    .vol-ring.hidden{display:none;}
    .vol-dot{width:14px;height:14px;border-radius:50%;background:var(--text-3);transition:background .2s,transform .15s;}
    .vol-ring.active .vol-dot{background:var(--red);transform:scale(1.3);}

    /* TRANSCRIPT */
    .v-transcript-wrap{margin-top:18px;width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:8px;}
    .v-interim{font-size:13px;color:var(--text-2);text-align:center;min-height:20px;line-height:1.5;font-style:italic;opacity:.7;}
    .v-final{font-size:15px;color:var(--text);text-align:center;min-height:40px;max-height:90px;overflow-y:auto;line-height:1.55;padding:0 4px;}
    .v-final.bot{color:var(--accent-3);}

    /* RODAPÉ */
    .v-footer{position:relative;z-index:10;width:100%;padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;}
    .wave-bars{display:flex;align-items:center;gap:3px;height:24px;}
    .wave-bar{width:3px;border-radius:3px;background:var(--accent);transform-origin:center;animation:waveDance .5s ease-in-out infinite alternate;opacity:.2;}
    .wave-bar:nth-child(1){height:6px; animation-delay:0s;}
    .wave-bar:nth-child(2){height:12px;animation-delay:.06s;}
    .wave-bar:nth-child(3){height:20px;animation-delay:.12s;}
    .wave-bar:nth-child(4){height:14px;animation-delay:.18s;}
    .wave-bar:nth-child(5){height:8px; animation-delay:.24s;}
    .wave-bars.listen .wave-bar{background:var(--red);opacity:1;}
    .wave-bars.speak  .wave-bar{background:var(--accent-2);opacity:1;}
    .wave-bars.think  .wave-bar{background:#60a5fa;opacity:.6;animation:waveDance 1.4s ease-in-out infinite alternate;}
    @keyframes waveDance{from{transform:scaleY(.3);}to{transform:scaleY(1.5);}}

    .v-state-info{flex:1;display:flex;flex-direction:column;gap:2px;align-items:center;}
    .v-state-name{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);transition:color .3s;}
    .v-state-hint{font-size:11px;color:var(--text-3);opacity:.6;}

    .v-stop-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer;outline:none;transition:all .2s;flex-shrink:0;}
    .v-stop-btn:hover{color:var(--red);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08);}
    .v-stop-btn:active{transform:scale(.93);}

    /* HISTÓRICO */
    .v-history{position:relative;z-index:10;width:100%;max-height:150px;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:7px;flex-shrink:0;border-top:1px solid var(--border);}
    .v-history:empty{display:none;border-top:none;}
    .vh-user{align-self:flex-end;background:rgba(124,106,255,.13);border:1px solid rgba(124,106,255,.18);color:var(--text);font-size:13px;padding:6px 12px;border-radius:14px 14px 3px 14px;max-width:82%;line-height:1.4;}
    .vh-bot{align-self:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text-2);font-size:13px;padding:6px 12px;border-radius:14px 14px 14px 3px;max-width:82%;line-height:1.4;}

    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(13,10,26,.95);border:1px solid var(--border);color:var(--text-2);font-size:13px;padding:10px 18px;border-radius:20px;transition:transform .3s;z-index:99;white-space:nowrap;backdrop-filter:blur(12px);}
    .toast.show{transform:translateX(-50%) translateY(0);}

    ::-webkit-scrollbar{width:3px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:4px;}
  </style>
</head>
<body>
<div class="shell">
  <div class="bg-glow" id="bgGlow"></div>
  <canvas id="particleCanvas"></canvas>

  <header class="v-header">
    <a href="index.html" class="v-back">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M8 2L3.5 6.5 8 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Chat
    </a>
    <div class="v-logo">
      <div class="v-logo-ring"><div class="v-logo-dot"></div></div>
      <span class="v-logo-name">S.A.R</span>
    </div>
    <div class="v-pill"><span class="v-pill-dot"></span><span>Voz</span></div>
  </header>

  <main class="v-center">
    <div class="orb-space">
      <div class="orb-label">
        <span class="orb-emoji" id="orbEmoji">🤖</span>
        <span class="orb-state" id="orbState">Iniciando</span>
      </div>
    </div>

    <!-- Botão aparece só na primeira vez pra pedir permissão -->
    <button class="start-btn" id="startBtn">🎙️ Ativar Modo Voz</button>

    <!-- Indicador de volume ao vivo -->
    <div class="vol-ring hidden" id="volRing"><div class="vol-dot"></div></div>

    <div class="v-transcript-wrap">
      <div class="v-interim" id="interimTxt"></div>
      <div class="v-final"   id="finalTxt"></div>
    </div>
  </main>

  <section class="v-history" id="vHistory"></section>

  <footer class="v-footer">
    <div class="wave-bars" id="waveBars">
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
    <div class="v-state-info">
      <span class="v-state-name" id="stateName">—</span>
      <span class="v-state-hint" id="stateHint">Aguarde</span>
    </div>
    <button class="v-stop-btn" id="stopBtn" title="Parar">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2.5" y="2.5" width="9" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ====================================================
   S.A.R — MODO VOZ HANDS-FREE
   VAD:    AudioContext AnalyserNode (detecção de silêncio)
   STT:    Groq Whisper API
   LLM:    Groq llama
   TTS:    SpeechSynthesis + fix Android PWA
   ==================================================== */

/* ---------- CHAVES ---------- */
function dec(s){return s.replace(/[a-zA-Z]/g,c=>{const b=c<="Z"?65:97;return String.fromCharCode(((c.charCodeAt(0)-b+15)%26)+b);});}
const CHAVES=["rdv_q4CwSU8whjfN11saVJytHRojm3QJMhJnKwj8v6dhgDnxMY7gKBwM","rdv_mvDn88ys3casJvuQxiBbHRojm3QJoPzW73eyBu8Dtc9mVO2D09Q3","rdv_uuBMlVuxyFshNSSpgouaHRojm3QJeOcIaoqeZHB68JtNehuYcjzP","rdv_ZwAEelTSOuFXDMCzCyAdHRojm3QJM3IT5whwyc6KYtVXSytIbUWH","rdv_tHcmv4NP8HSTN8Y0uCBGHRojm3QJyE6P0JxZO00XKII62YoCq2aU"];
let ci=0;
function chave(){return dec(CHAVES[ci]);}
function rotChave(){ci=(ci+1)%CHAVES.length;}

/* ---------- DOM ---------- */
const canvas    =document.getElementById("particleCanvas");
const ctx2d     =canvas.getContext("2d");
const bgGlow    =document.getElementById("bgGlow");
const waveBars  =document.getElementById("waveBars");
const stateName =document.getElementById("stateName");
const stateHint =document.getElementById("stateHint");
const orbEmoji  =document.getElementById("orbEmoji");
const orbState  =document.getElementById("orbState");
const interimTxt=document.getElementById("interimTxt");
const finalTxt  =document.getElementById("finalTxt");
const startBtn  =document.getElementById("startBtn");
const volRing   =document.getElementById("volRing");
const stopBtn   =document.getElementById("stopBtn");
const vHistory  =document.getElementById("vHistory");
const toastEl   =document.getElementById("toast");

/* ---------- PARTÍCULAS 3D ---------- */
const NP=300; let parts=[],orbMode="idle",_energy=0,_rotY=0,_rotX=0;
const CORES={idle:{i:[124,106,255],o:[70,50,180],g:[124,106,255]},listen:{i:[255,110,110],o:[190,50,50],g:[248,113,113]},think:{i:[96,165,250],o:[40,90,200],g:[96,165,250]},speak:{i:[167,139,250],o:[110,70,240],g:[167,139,250]}};

function resizeCanvas(){const s=canvas.parentElement;canvas.width=s.clientWidth;canvas.height=s.clientHeight;initParts();}
function initParts(){parts=[];const g=Math.PI*(1+Math.sqrt(5));for(let i=0;i<NP;i++){const th=Math.acos(1-2*(i+.5)/NP),ph=g*i;parts.push({ox:Math.sin(th)*Math.cos(ph),oy:Math.sin(th)*Math.sin(ph),oz:Math.cos(th),r:.4+Math.random()*1.3,phase:Math.random()*Math.PI*2,spd:.003+Math.random()*.004,amp:2+Math.random()*4});}}
function lerp(a,b,t){return a+(b-a)*t;}

function drawFrame(ts){
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H*.35,R=104;
  ctx2d.clearRect(0,0,W,H);
  const eT=(orbMode==="listen"||orbMode==="speak")?1:orbMode==="think"?.5:0;
  _energy=lerp(_energy,eT,.04);
  _rotY+=.0013+_energy*.006; _rotX+=.0004+_energy*.002;
  const cY=Math.cos(_rotY),sY=Math.sin(_rotY),cX=Math.cos(_rotX),sX=Math.sin(_rotX);
  const C=CORES[orbMode]||CORES.idle;
  for(const p of parts){
    const x1=p.ox*cY-p.oz*sY,z1=p.ox*sY+p.oz*cY;
    const y1=p.oy*cX-z1*sX,z2=p.oy*sX+z1*cX;
    const pulse=Math.sin(ts*p.spd*1000+p.phase)*p.amp*_energy;
    const sc=R+pulse,sx=cx+x1*sc,sy=cy+y1*sc,d=(z2+1)/2;
    const ri=Math.round(lerp(C.o[0],C.i[0],d)),gi=Math.round(lerp(C.o[1],C.i[1],d)),bi=Math.round(lerp(C.o[2],C.i[2],d));
    const al=Math.min(1,.18+d*.75+_energy*.15),sz=Math.max(.3,p.r*(.5+d*.7)*(1+_energy*.3));
    ctx2d.shadowBlur=d>.7?(6+_energy*8):0;
    if(d>.7)ctx2d.shadowColor=`rgba(${C.g[0]},${C.g[1]},${C.g[2]},.8)`;
    ctx2d.beginPath();ctx2d.arc(sx,sy,sz,0,Math.PI*2);
    ctx2d.fillStyle=`rgba(${ri},${gi},${bi},${al})`;ctx2d.fill();
  }
  ctx2d.shadowBlur=0;
  const gr=22+_energy*18,grd=ctx2d.createRadialGradient(cx,cy,0,cx,cy,gr);
  grd.addColorStop(0,`rgba(${C.g[0]},${C.g[1]},${C.g[2]},${.45+_energy*.35})`);
  grd.addColorStop(.5,`rgba(${C.g[0]},${C.g[1]},${C.g[2]},${.1+_energy*.1})`);
  grd.addColorStop(1,`rgba(${C.g[0]},${C.g[1]},${C.g[2]},0)`);
  ctx2d.beginPath();ctx2d.arc(cx,cy,gr,0,Math.PI*2);ctx2d.fillStyle=grd;ctx2d.fill();
  requestAnimationFrame(drawFrame);
}

/* ---------- UI ---------- */
function setUI(modo){
  orbMode=modo; bgGlow.className="bg-glow"; waveBars.className="wave-bars";
  if(modo==="idle"){
    bgGlow.classList.add();
    orbEmoji.textContent="🤖";orbState.textContent="Ouvindo";orbState.style.color="";
    stateName.textContent="Aguardando";stateName.style.color="";
    stateHint.textContent="Pode falar a qualquer hora";
    interimTxt.textContent="";finalTxt.textContent="";finalTxt.className="v-final";
    volRing.classList.remove("active");
  }else if(modo==="listen"){
    bgGlow.classList.add("listen");waveBars.classList.add("listen");
    orbEmoji.textContent="👂";orbState.textContent="Ouvindo";orbState.style.color="var(--red)";
    stateName.textContent="Ouvindo";stateName.style.color="var(--red)";
    stateHint.textContent="Detectei sua voz…";
    volRing.classList.add("active");
  }else if(modo==="think"){
    bgGlow.classList.add("think");waveBars.classList.add("think");
    orbEmoji.textContent="🧠";orbState.textContent="Pensando";orbState.style.color="#60a5fa";
    stateName.textContent="Pensando";stateName.style.color="#60a5fa";
    stateHint.textContent="Processando…";
    volRing.classList.remove("active");
    interimTxt.textContent="";
  }else if(modo==="speak"){
    bgGlow.classList.add("speak");waveBars.classList.add("speak");
    orbEmoji.textContent="💬";orbState.textContent="Respondendo";orbState.style.color="var(--accent-2)";
    stateName.textContent="Respondendo";stateName.style.color="var(--accent-2)";
    stateHint.textContent="Toque ■ para interromper";
  }
}

let _tt;
function toast(msg,ms=3200){toastEl.textContent=msg;toastEl.classList.add("show");clearTimeout(_tt);_tt=setTimeout(()=>toastEl.classList.remove("show"),ms);}
function addHist(txt,tipo){const d=document.createElement("div");d.className=tipo==="user"?"vh-user":"vh-bot";d.textContent=txt;vHistory.appendChild(d);vHistory.scrollTop=vHistory.scrollHeight;}

/* ---------- SYSTEM PROMPT ---------- */
function buildSys(){
  const now=new Date();
  const dt=now.toLocaleDateString("pt-BR",{timeZone:"America/Sao_Paulo",weekday:"long",year:"numeric",month:"long",day:"numeric"});
  const hr=now.toLocaleTimeString("pt-BR",{timeZone:"America/Sao_Paulo",hour:"2-digit",minute:"2-digit"});
  return `Voce e a S.A.R — IA feminina brasileira (ela/dela), criada pela Evolution Games Studio, programada pelo Joao Antonio.
Responde sempre em portugues do Brasil de forma natural e conversacional.
MODO VOZ: respostas serao lidas em voz alta. Seja CONCISA e NATURAL.
Sem listas, sem markdown, sem emojis, sem asteriscos. Apenas texto limpo corrido.
Respostas curtas: 1 a 3 frases quando possivel.
DATA E HORA: ${dt}, ${hr} (Brasilia).
Nunca invente informacoes. Se nao souber, diga que nao sabe.`;
}
let mensagens=[{role:"system",content:buildSys()}];

/* ---------- GROQ LLM ---------- */
async function chamarGroq(txt){
  mensagens.push({role:"user",content:txt});
  const MAX=14,sys=mensagens[0];
  let hist=mensagens.slice(1);
  if(hist.length>MAX)hist=hist.slice(-MAX);
  for(const m of["llama-3.3-70b-versatile","llama3-8b-8192"]){
    try{
      const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Authorization":"Bearer "+chave(),"Content-Type":"application/json"},body:JSON.stringify({model:m,temperature:.4,max_tokens:280,messages:[sys,...hist]}),signal:AbortSignal.timeout(20000)});
      if(!r.ok){if(r.status===429||r.status===401)rotChave();throw new Error("HTTP"+r.status);}
      const data=await r.json();
      const resp=data.choices?.[0]?.message?.content?.trim();
      if(!resp)throw new Error("vazia");
      mensagens.push({role:"assistant",content:resp});
      if(mensagens.length>MAX+1)mensagens=[mensagens[0],...mensagens.slice(-MAX)];
      return resp;
    }catch(e){console.warn("LLM",m,e.message);}
  }
  throw new Error("LLM falhou");
}

/* ---------- GROQ WHISPER ---------- */
async function transcrever(blob){
  const ext=blob.type.includes("ogg")?"audio.ogg":blob.type.includes("mp4")?"audio.mp4":"audio.webm";
  const fd=new FormData();
  fd.append("file",blob,ext);
  fd.append("model","whisper-large-v3-turbo");
  fd.append("language","pt");
  fd.append("response_format","json");
  for(let t=0;t<CHAVES.length;t++){
    try{
      const r=await fetch("https://api.groq.com/openai/v1/audio/transcriptions",{method:"POST",headers:{"Authorization":"Bearer "+chave()},body:fd,signal:AbortSignal.timeout(25000)});
      if(!r.ok){if(r.status===429||r.status===401)rotChave();throw new Error("HTTP"+r.status);}
      const data=await r.json();
      return (data.text||"").trim();
    }catch(e){console.warn("Whisper",t,e.message);rotChave();}
  }
  throw new Error("Whisper falhou");
}

/* ---------- TTS fix Android ---------- */
let _ttsQ=[],_ttsSpeaking=false,_ttsKA=null;
function pararTTS(){speechSynthesis.cancel();_ttsQ=[];_ttsSpeaking=false;if(_ttsKA){clearInterval(_ttsKA);_ttsKA=null;}}
function falar(texto,onEnd){
  pararTTS();_ttsSpeaking=true;
  const limpo=texto.replace(/\*\*(.+?)\*\*/g,"$1").replace(/\*(.+?)\*/g,"$1").replace(/`(.+?)`/g,"$1").replace(/#{1,6}\s/g,"").replace(/[*_~`>#\-]/g,"").replace(/https?:\/\/\S+/g,"link").replace(/[\u{1F000}-\u{1FFFF}]/gu,"").replace(/[\u{2600}-\u{27BF}]/gu,"").replace(/\s+/g," ").trim();
  if(!limpo){onEnd?.();return;}
  _ttsQ=limpo.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.length>0);
  _ttsKA=setInterval(()=>{if(speechSynthesis.speaking){speechSynthesis.pause();setTimeout(()=>speechSynthesis.resume(),50);}},10000);
  function next(){
    if(!_ttsSpeaking||!_ttsQ.length){clearInterval(_ttsKA);_ttsKA=null;_ttsSpeaking=false;onEnd?.();return;}
    const u=new SpeechSynthesisUtterance(_ttsQ.shift());
    u.lang="pt-BR";u.rate=.95;u.pitch=1.05;u.volume=1;
    const voz=speechSynthesis.getVoices().find(v=>v.lang==="pt-BR"||v.lang.startsWith("pt"));
    if(voz)u.voice=voz;
    u.onend=()=>setTimeout(next,70);u.onerror=()=>setTimeout(next,70);
    try{speechSynthesis.speak(u);}catch(e){setTimeout(next,150);}
  }
  next();
}

/* ====================================================
   VAD — Detecção de voz por volume (AudioContext)
   ====================================================
   Fluxo:
   1. Fica monitorando RMS do microfone continuamente
   2. Volume > LIMIAR_FALA → começa a gravar (MediaRecorder)
   3. Volume < LIMIAR_SILENCIO por SILENCIO_MS → para e envia
   ==================================================== */

const LIMIAR_FALA     = 18;   // RMS mínimo pra considerar fala (0-255)
const LIMIAR_SILENCIO = 12;   // RMS abaixo = silêncio
const SILENCIO_MS     = 1400; // ms de silêncio pra encerrar gravação
const MIN_FALA_MS     = 400;  // gravação mínima pra enviar
const MAX_FALA_MS     = 30000;// gravação máxima

let audioCtx=null, analyser=null, micSource=null, mediaStream=null;
let mediaRec=null, audioChunks=[], gravando=false;
let _estadoVAD="idle"; // idle | listen | think | speak
let _silencioTimer=null, _maxTimer=null, _inicioFala=0;
let _vadAtivo=false, _vadFrame=null;

function getRMS(buf){
  let sum=0;for(let i=0;i<buf.length;i++)sum+=buf[i]*buf[i];
  return Math.sqrt(sum/buf.length);
}

function getMime(){
  const ts=["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/ogg","audio/mp4"];
  for(const t of ts)if(MediaRecorder.isTypeSupported(t))return t;
  return "";
}

function iniciarGravacao(){
  if(gravando)return;
  gravando=true; audioChunks=[];
  _estadoVAD="listen"; setUI("listen");
  _inicioFala=Date.now();

  const mime=getMime();
  try{mediaRec=new MediaRecorder(mediaStream,mime?{mimeType:mime}:{});}
  catch(e){mediaRec=new MediaRecorder(mediaStream);}

  mediaRec.ondataavailable=e=>{if(e.data&&e.data.size>0)audioChunks.push(e.data);};
  mediaRec.onstop=async()=>{
    gravando=false;
    const duracao=Date.now()-_inicioFala;
    const mime2=mediaRec.mimeType||"audio/webm";
    const blob=new Blob(audioChunks,{type:mime2});
    audioChunks=[];
    if(blob.size<2000||duracao<MIN_FALA_MS){
      // muito curto, ignora e volta a ouvir
      if(_estadoVAD!=="speak")voltarOuvir();
      return;
    }
    await processarBlob(blob);
  };
  mediaRec.start(200);

  // Segurança: para após MAX_FALA_MS
  _maxTimer=setTimeout(()=>{if(gravando)pararGravacao();},MAX_FALA_MS);
}

function pararGravacao(){
  clearTimeout(_silencioTimer); clearTimeout(_maxTimer);
  _silencioTimer=null; _maxTimer=null;
  if(!gravando)return;
  try{mediaRec.stop();}catch(e){}
}

async function processarBlob(blob){
  _estadoVAD="think"; setUI("think");
  interimTxt.textContent="🔍 Transcrevendo…";

  let texto="";
  try{texto=await transcrever(blob);}
  catch(e){console.error(e);toast("⚠️ Erro na transcrição");voltarOuvir();return;}

  if(!texto||texto.length<2){voltarOuvir();return;}

  interimTxt.textContent="";
  finalTxt.textContent=texto; finalTxt.className="v-final";
  addHist(texto,"user");

  let resposta="";
  try{resposta=await chamarGroq(texto);}
  catch(e){resposta="Tive um problema de conexão. Pode repetir?";toast("⚠️ Erro de conexão");}

  finalTxt.textContent=resposta; finalTxt.className="v-final bot";
  addHist(resposta,"bot");
  _estadoVAD="speak"; setUI("speak");

  falar(resposta,()=>{
    if(_estadoVAD==="speak")voltarOuvir();
  });
}

function voltarOuvir(){
  _estadoVAD="idle"; setUI("idle");
  // pequeno delay pra não pegar eco da resposta
  setTimeout(()=>{if(_vadAtivo&&_estadoVAD==="idle")_estadoVAD="pronto";},600);
}

/* Loop VAD principal */
function vadLoop(){
  if(!_vadAtivo){_vadFrame=null;return;}
  _vadFrame=requestAnimationFrame(vadLoop);

  const buf=new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(buf);

  // Converte de 0-255 centrado em 128 para amplitude real
  const amp=new Float32Array(buf.length);
  for(let i=0;i<buf.length;i++)amp[i]=(buf[i]-128)/128;
  const rms=getRMS(amp)*255; // escala pra 0-255 pra comparar com limiar

  // Atualiza indicador visual de volume
  if(volRing&&!volRing.classList.contains("hidden")){
    volRing.classList.toggle("active",rms>LIMIAR_FALA*.7);
  }

  // Só age se não estiver processando/falando
  if(_estadoVAD!=="idle"&&_estadoVAD!=="pronto")return;

  if(rms>LIMIAR_FALA){
    // Detectou fala → começa a gravar
    clearTimeout(_silencioTimer);
    _silencioTimer=null;
    if(!gravando)iniciarGravacao();
  } else if(gravando){
    // Silêncio detectado enquanto gravava
    if(rms<LIMIAR_SILENCIO&&!_silencioTimer){
      _silencioTimer=setTimeout(()=>{
        pararGravacao();
        _silencioTimer=null;
      },SILENCIO_MS);
    } else if(rms>=LIMIAR_SILENCIO&&_silencioTimer){
      // Voltou a falar, cancela timer de silêncio
      clearTimeout(_silencioTimer);
      _silencioTimer=null;
    }
  }
}

/* ---------- INICIAR TUDO ---------- */
async function ativar(){
  startBtn.classList.add("hidden");
  volRing.classList.remove("hidden");

  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
  }catch(e){
    console.error("Mic",e);
    toast("🚫 Permissão de microfone negada",5000);
    startBtn.classList.remove("hidden");
    return;
  }

  // Cria AudioContext pra VAD
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=512;
  analyser.smoothingTimeConstant=0.3;
  micSource=audioCtx.createMediaStreamSource(mediaStream);
  micSource.connect(analyser);
  // NÃO conecta ao destination — evita feedback/eco

  _vadAtivo=true;
  _estadoVAD="pronto";
  setUI("idle");

  // Pré-carrega vozes TTS
  speechSynthesis.getVoices();

  vadLoop();
  toast("🎙️ Modo voz ativado — pode falar!",2500);
}

/* ---------- BOTÃO PARAR ---------- */
stopBtn.onclick=()=>{
  pararTTS();
  pararGravacao();
  _estadoVAD="idle"; setUI("idle");
  finalTxt.textContent=""; finalTxt.className="v-final";
  interimTxt.textContent="";
  setTimeout(()=>{if(_vadAtivo)_estadoVAD="pronto";},800);
};

/* ---------- INIT ---------- */
(function init(){
  resizeCanvas();
  window.addEventListener("resize",resizeCanvas);
  requestAnimationFrame(drawFrame);

  speechSynthesis.getVoices();
  if(speechSynthesis.onvoiceschanged!==undefined)
    speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();

  if(!navigator.mediaDevices?.getUserMedia){
    finalTxt.textContent="Seu navegador não suporta gravação de áudio.";
    startBtn.disabled=true;
    toast("❌ Sem suporte a microfone",5000);
    return;
  }

  startBtn.onclick=ativar;
  console.log("🎙️ S.A.R Modo Voz VAD iniciado");
})();
</script>
